<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="Your Website Title Here">
    <meta property="og:description" content="Join our premium online learning platform and upgrade your skills today.">
    <meta property="og:image" content="https://yourwebsite.com/asset/preview-image.jpg">
    <meta property="og:url" content="https://yourwebsite.com">
    <meta property="og:type" content="website">
    <meta name="description"
        content="Join our premium online learning platform. Access interactive courses, live community zones, and expert tutors to upgrade your skills today.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="icon" type="image/png" href="./asset/logo_Favicon.webp">
    <title>Create Account - Stackly</title>
    <link rel="stylesheet" href="common.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #4C1D95 0%, #2E1065 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            display: flex;
            width: 100%;
            max-width: 1000px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }

        .left-panel {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            /* max-height: 90vh; */
        }

        .back-home {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: rgb(46 16 101 / 89%);
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 15px;
            transition: 0.3s;
            width: fit-content;
        }

        .back-home:hover {
            color: #FBBF24;
        }

        .back-home svg {
            width: 16px;
            height: 16px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            color: #4C1D95;
        }

        .logo svg {
            width: 32px;
            height: 32px;
            color: #FBBF24;
        }

        .logo span {
            font-size: 24px;
            font-weight: bold;
        }

        h2 {
            color: #2E1065;
            margin-bottom: 5px;
            font-size: 26px;
        }

        p {
            color: #64748b;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .role-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .role-card {
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 10px;
            cursor: pointer;
            text-align: center;
            transition: 0.3s;
        }

        .role-card h3 {
            margin-top: 5px;
            color: #0F172A;
            font-size: 15px;
        }

        .role-card.active {
            border-color: #FBBF24;
            background: rgba(251, 191, 36, 0.1);
        }

        .input-group {
            margin-bottom: 15px;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #2E1065;
            font-size: 13px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            transition: 0.3s;
            color: #0F172A;
        }

        input:focus {
            border-color: #FBBF24;
            box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.2);
        }

        input[type="password"]::-ms-reveal,
        input[type="password"]::-ms-clear {
            display: none;
        }

        .field-error {
            color: #ef4444;
            font-size: 12px;
            font-weight: 600;
            margin-top: 5px;
            display: none;
        }

        .input-error input {
            border-color: #ef4444;
        }

        .pwd-wrapper {
            position: relative;
        }

        .eye-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #64748b;
            display: flex;
            align-items: center;
        }

        .eye-btn:hover {
            color: #4C1D95;
        }

        .eye-btn svg {
            width: 18px;
            height: 18px;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #FBBF24;
            color: #2E1065;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(251, 191, 36, 0.4);
            background: #F59E0B;
        }

        .social-login {
            text-align: center;
            margin-top: 20px;
        }

        .social-login p {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 10px;
            position: relative;
        }

        .social-login p::before,
        .social-login p::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 30%;
            height: 1px;
            background: #e2e8f0;
        }

        .social-login p::before {
            left: 0;
        }

        .social-login p::after {
            right: 0;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .social-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid #cbd5e1;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: 0.3s;
            color: #4C1D95;
        }

        .social-btn:hover {
            background: #f8fafc;
            border-color: #FBBF24;
            color: #FBBF24;
            transform: translateY(-2px);
        }

        .social-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .links {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        .links a {
            color: #4C1D95;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .links a:hover {
            color: #FBBF24;
        }

        .right-panel {
            flex: 1.2;
            position: relative;
            background: #000;
        }

        #preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #4C1D95 0%, #2E1065 100%);
            z-index: 99999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .loader-content {
            text-align: center;
        }

        .loader-icon {
            font-size: 60px;
            margin-bottom: 20px;
            color: #FBBF24;
            animation: pulse 1.5s infinite;
        }

        .loader-text {
            font-size: 32px;
            font-weight: 800;
            color: white;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(251, 191, 36, 0.3);
            border-top-color: #FBBF24;
            border-radius: 50%;
            margin: 0 auto;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
            }
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        .slide.active {
            opacity: 1;
        }

        .image-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(46, 16, 101, 0.7), rgba(251, 191, 36, 0.3));
            z-index: 10;
        }

        @media(max-width: 850px) {
            .login-container {
                flex-direction: column;
                max-width: 450px;
            }

            .right-panel {
                display: block;
                min-height: 200px;
            }

            .left-panel {
                padding: 30px 25px;
                max-height: none;
            }
        }
    </style>
</head>

<body>
    <div id="preloader">
        <div class="loader-content">
            <i class="fas fa-graduation-cap loader-icon"></i>
            <h2 class="loader-text">Stackly Education</h2>
            <div class="spinner"></div>
        </div>
    </div>

    <div class="login-container">

        <div class="left-panel">

            <a href="index.html" class="back-home">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Back to Home
            </a>

            <div class="nav-logo">
                <a href="index.html">
                    <img src="./asset/yellow_logo.webp" alt="logo" class="logo"></a>
            </div>

            <h2>Create Account</h2>
            <p>Join EduSmart today!</p>

            <div class="role-selector">
                <div class="role-card active" id="reg-student">
                    <div style="font-size: 24px;">👨‍🎓</div>
                    <h3>Student</h3>
                </div>
                <div class="role-card" id="reg-teacher">
                    <div style="font-size: 24px;">👨‍🏫</div>
                    <h3>Teacher</h3>
                </div>
            </div>

            <form id="registerForm">

                <div class="input-group" id="nameGroup">
                    <label>Full Name</label>
                    <input type="text" id="fullname" placeholder="Enter your full name">
                    <div class="field-error" id="nameError">Full Name is required</div>
                </div>

                <div class="input-group" id="emailGroup">
                    <label>Email Address</label>
                    <input type="email" id="regEmail" placeholder="Enter email">
                    <div class="field-error" id="emailError">Email is required</div>
                </div>

                <div class="input-group" id="pwdGroup">
                    <label>Password</label>
                    <div class="pwd-wrapper">
                        <input type="password" id="regPwd" placeholder="Create password (min 6 chars)">
                        <button type="button" class="eye-btn" id="toggleEye1">
                            <svg class="eyeIcon1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path
                                    d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24M1 1l22 22">
                                </path>
                            </svg>
                        </button>
                    </div>
                    <div class="field-error" id="pwdError">Password is required</div>
                </div>

                <div class="input-group" id="cpwdGroup">
                    <label>Confirm Password</label>
                    <div class="pwd-wrapper">
                        <input type="password" id="confirmPwd" placeholder="Confirm password">
                        <button type="button" class="eye-btn" id="toggleEye2">
                            <svg class="eyeIcon2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path
                                    d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24M1 1l22 22">
                                </path>
                            </svg>
                        </button>
                    </div>
                    <div class="field-error" id="cpwdError">Please confirm your password</div>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">Create Account</button>
            </form>

            <div class="social-login">
                <p>or sign up with</p>
                <div class="social-icons">

                    <button class="social-btn" onclick="window.location.href='404page.html'">
                        <i class="fa-brands fa-google"></i>
                    </button>


                    <button class="social-btn" onclick="window.location.href='404page.html'">
                        <i class="fa-brands fa-instagram"></i>
                    </button>


                    <button class="social-btn" onclick="window.location.href='404page.html'">
                        <i class="fa-brands fa-x-twitter"></i>
                    </button>
                </div>
            </div>

            <div class="links">
                <p>Already have an account? <a href="login.html">Login here</a></p>
            </div>
        </div>

        <div class="right-panel">
            <img src="./asset/d5.webp" alt="Teacher" class="slide active">
            <img src="./asset/d7.webp" alt="Teacher" class="slide">
            <img src="./asset/d8.webp" alt="Teacher" class="slide">
            <div class="image-overlay"></div>
        </div>

    </div>

    <script>
        let currentRole = 'student';
        const studentCard = document.getElementById('reg-student');
        const teacherCard = document.getElementById('reg-teacher');

        studentCard.addEventListener('click', () => {
            currentRole = 'student';
            studentCard.classList.add('active');
            teacherCard.classList.remove('active');
        });

        teacherCard.addEventListener('click', () => {
            currentRole = 'teacher';
            teacherCard.classList.add('active');
            studentCard.classList.remove('active');
        });

        const eyeOpenSVG = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`;
        const eyeClosedSVG = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24M1 1l22 22"></path>`;

        const toggleEye1 = document.getElementById('toggleEye1');
        const pwdInput1 = document.getElementById('regPwd');
        const eyeIcon1 = document.querySelector('.eyeIcon1');

        toggleEye1.addEventListener('click', () => {
            if (pwdInput1.type === 'password') {
                pwdInput1.type = 'text';
                eyeIcon1.innerHTML = eyeOpenSVG;
            } else {
                pwdInput1.type = 'password';
                eyeIcon1.innerHTML = eyeClosedSVG;
            }
        });

        const toggleEye2 = document.getElementById('toggleEye2');
        const pwdInput2 = document.getElementById('confirmPwd');
        const eyeIcon2 = document.querySelector('.eyeIcon2');

        toggleEye2.addEventListener('click', () => {
            if (pwdInput2.type === 'password') {
                pwdInput2.type = 'text';
                eyeIcon2.innerHTML = eyeOpenSVG;
            } else {
                pwdInput2.type = 'password';
                eyeIcon2.innerHTML = eyeClosedSVG;
            }
        });

        document.getElementById('registerForm').addEventListener('submit', (e) => {
            e.preventDefault();

            const nameInput = document.getElementById('fullname');
            const emailInput = document.getElementById('regEmail');
            const pwdInput = document.getElementById('regPwd');
            const cpwdInput = document.getElementById('confirmPwd');

            const nameGroup = document.getElementById('nameGroup');
            const emailGroup = document.getElementById('emailGroup');
            const pwdGroup = document.getElementById('pwdGroup');
            const cpwdGroup = document.getElementById('cpwdGroup');

            const nameError = document.getElementById('nameError');
            const emailError = document.getElementById('emailError');
            const pwdError = document.getElementById('pwdError');
            const cpwdError = document.getElementById('cpwdError');

            const nameVal = nameInput.value.trim();
            const emailVal = emailInput.value.trim();
            const pwdVal = pwdInput.value;
            const cpwdVal = cpwdInput.value;

            let isValid = true;

            if (nameVal === '') {
                nameGroup.classList.add('input-error');
                nameError.innerText = 'Full Name is required';
                nameError.style.display = 'block';
                isValid = false;
            }

            if (emailVal === '') {
                emailGroup.classList.add('input-error');
                emailError.innerText = 'Email is required';
                emailError.style.display = 'block';
                isValid = false;
            }

            if (pwdVal === '') {
                pwdGroup.classList.add('input-error');
                pwdError.innerText = 'Password is required';
                pwdError.style.display = 'block';
                isValid = false;
            } else if (pwdVal.length < 6) {
                pwdGroup.classList.add('input-error');
                pwdError.innerText = 'Password must be at least 6 characters';
                pwdError.style.display = 'block';
                isValid = false;
            }

            if (cpwdVal === '') {
                cpwdGroup.classList.add('input-error');
                cpwdError.innerText = 'Please confirm your password';
                cpwdError.style.display = 'block';
                isValid = false;
            } else if (pwdVal !== cpwdVal) {
                cpwdGroup.classList.add('input-error');
                cpwdError.innerText = 'Passwords do not match';
                cpwdError.style.display = 'block';
                isValid = false;
            }

            if (isValid) {
                window.location.href = 'login.html';
            }
        });

        const clearError = (inputId, groupId, errorId) => {
            document.getElementById(inputId).addEventListener('input', function () {
                document.getElementById(groupId).classList.remove('input-error');
                document.getElementById(errorId).style.display = 'none';
            });
        }

        clearError('fullname', 'nameGroup', 'nameError');
        clearError('regEmail', 'emailGroup', 'emailError');
        clearError('regPwd', 'pwdGroup', 'pwdError');
        clearError('confirmPwd', 'cpwdGroup', 'cpwdError');

        let slideIndex = 0;
        const slides = document.querySelectorAll('.slide');

        if (slides.length > 0) {
            setInterval(() => {
                slides[slideIndex].classList.remove('active');
                slideIndex = (slideIndex + 1) % slides.length;
                slides[slideIndex].classList.add('active');
            }, 3000);
        }

        window.addEventListener('load', () => {
            const preloader = document.getElementById('preloader');

            document.body.style.overflow = 'hidden';

            setTimeout(() => {
                preloader.style.opacity = '0';
                preloader.style.visibility = 'hidden';

                document.body.style.overflow = 'auto';
                document.body.style.overflowX = 'hidden';
            }, 1000);
        });
    </script>
</body>

</html>
