<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Ancient Path Lost</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0a0310;
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .grid-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image:
                linear-gradient(rgba(238, 187, 48, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(238, 187, 48, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 1;
        }

        .glow-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw;
            height: 80vh;
            background: radial-gradient(circle, rgba(238, 187, 48, 0.1) 0%, rgba(10, 3, 16, 0) 70%);
            z-index: 2;
            pointer-events: none;
        }

        .content-wrapper {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 800px;
            padding: 0 20px;
        }

        .warning-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            border: 1px solid #eebb30;
            color: #eebb30;
            padding: 8px 24px;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: rgba(238, 187, 48, 0.05);
            margin-bottom: 20px;
            box-shadow: 0 0 15px rgba(238, 187, 48, 0.2);
            animation: pulseBadge 2s infinite;
        }

        @keyframes pulseBadge {
            0% {
                box-shadow: 0 0 10px rgba(238, 187, 48, 0.2);
            }

            50% {
                box-shadow: 0 0 25px rgba(238, 187, 48, 0.5);
            }

            100% {
                box-shadow: 0 0 10px rgba(238, 187, 48, 0.2);
            }
        }

        .error-code {
            font-size: clamp(8rem, 20vw, 15rem);
            font-weight: 900;
            line-height: 1;
            margin: 10px 0;
            color: transparent;
            -webkit-text-stroke: 3px #eebb30;
            text-shadow: 0 0 40px rgba(238, 187, 48, 0.3);
            position: relative;
            display: inline-block;
        }

        .error-desc {
            font-size: clamp(1rem, 2vw, 1.2rem);
            color: #bfaedc;
            line-height: 1.6;
            margin-bottom: 50px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 32px;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-ghost {
            background: transparent;
            color: #eebb30;
            border: 2px solid #eebb30;
        }

        .btn-ghost:hover {
            background: rgba(238, 187, 48, 0.1);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(238, 187, 48, 0.15);
        }

        .btn-solid {
            background: #eebb30;
            color: #0a0310;
            border: 2px solid #eebb30;
        }

        .btn-solid:hover {
            background: #ffffff;
            border-color: #ffffff;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(238, 187, 48, 0.4);
        }

        @media (max-width: 600px) {
            .button-group {
                flex-direction: column;
                gap: 15px;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>

<body>

    <div class="grid-bg"></div>
    <div class="glow-overlay"></div>

    <div class="content-wrapper">

        <div class="warning-badge">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z">
                </path>
                <line x1="12" y1="9" x2="12" y2="13"></line>
                <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
            MISSION FAILED
        </div>

        <h1 class="error-code" id="glitchText">404</h1>

        <p class="error-desc">
            The ancient gate is sealed. The cosmic thread has unwound, and the link to this knowledge is broken, or the
            relic has moved beyond your grasp.
        </p>

        <div class="button-group">
            <button onclick="history.back()" class="btn btn-ghost">
                ← Go Back
            </button>

            <a href="index.html" class="btn btn-solid">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                Go To Home
            </a>
        </div>

    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const errorText = document.getElementById('glitchText');

            document.addEventListener('mousemove', (e) => {
                const x = (window.innerWidth / 2 - e.pageX) / 25;
                const y = (window.innerHeight / 2 - e.pageY) / 25;

                errorText.style.transform = `translate(${x}px, ${y}px)`;

                errorText.style.textShadow = `${-x}px ${-y}px 40px rgba(238, 187, 48, 0.4)`;
            });

            document.addEventListener('mouseleave', () => {
                errorText.style.transform = `translate(0px, 0px)`;
                errorText.style.textShadow = `0 0 40px rgba(238, 187, 48, 0.3)`;
            });
        });
    </script>

</body>

</html>
